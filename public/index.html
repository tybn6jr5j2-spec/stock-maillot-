// ─── CLÉ API ─────────────────────────────────────────────────────────────────
function getApiKey() { return "ok"; }
function saveApiKey(key) { }

function ApiKeyModal({ onSave }) {
  const [key, setKey] = React.useState("");
  const [err, setErr] = React.useState("");
  const handle = () => {
    if (!key.trim().startsWith("sk-ant-")) { setErr("La clé doit commencer par sk-ant-..."); return; }
    saveApiKey(key.trim());
    onSave(key.trim());
  };
  return (
    <div style={{position:"fixed",inset:0,background:"#0f172a",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,zIndex:9999}}>
      <div style={{fontSize:48,marginBottom:16}}>👙</div>
      <div style={{fontFamily:"'Outfit',sans-serif",color:"#fff",fontSize:22,fontWeight:800,marginBottom:8,textAlign:"center"}}>Stock Maillot</div>
      <div style={{color:"#94a3b8",fontSize:14,textAlign:"center",marginBottom:32}}>Entre ta clé API Anthropic pour activer le scan photo</div>
      <div style={{width:"100%",maxWidth:400}}>
        <input
          style={{width:"100%",padding:"12px 16px",borderRadius:12,border:"1.5px solid #334155",background:"#1e293b",color:"#fff",fontSize:13,outline:"none",marginBottom:8,boxSizing:"border-box"}}
          placeholder="sk-ant-api03-..."
          value={key}
          onChange={e=>setKey(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&handle()}
          autoFocus
        />
        {err&&<div style={{color:"#ef4444",fontSize:12,marginBottom:8}}>{err}</div>}
        <button
          style={{width:"100%",background:"linear-gradient(135deg,#f43f8e,#f97316)",color:"#fff",border:"none",borderRadius:12,padding:14,fontWeight:800,fontSize:15,cursor:"pointer"}}
          onClick={handle}
        >
          Démarrer l'application ✓
        </button>
        <div style={{color:"#475569",fontSize:11,textAlign:"center",marginTop:12}}>
          Ta clé est sauvegardée uniquement sur ton appareil. Elle ne sera jamais partagée.
        </div>
        <div style={{color:"#475569",fontSize:11,textAlign:"center",marginTop:8}}>
          Obtenir une clé sur platform.anthropic.com → API Keys
        </div>
      </div>
    </div>
  );
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
const getActuel1P = (cell) => (cell.init||0) - (cell.sold||0);
const getActuelHaut = (cell) => (cell.init||0) - (cell.soldHaut||0);
const getActuelBas = (cell) => (cell.init||0) - (cell.soldBas||0);


function alertBg(v) {
  if (v <= 0) return { bg:"#fef2f2", color:"#dc2626", fw:800, label: v <= 0 ? "0 🚨" : `${v}` };
  if (v <= 2) return { bg:"#fef9c3", color:"#d97706", fw:700, label: `${v} ⚠️` };
  return { bg:"#f0fdf4", color:"#16a34a", fw:600, label: `${v}` };
}

function loadStock() {
  try { const s=localStorage.getItem("stock_v4"); return s?JSON.parse(s):JSON.parse(JSON.stringify(INITIAL_STOCK)); }
  catch { return JSON.parse(JSON.stringify(INITIAL_STOCK)); }
}
function loadSales() {
  try { return JSON.parse(localStorage.getItem("sales_v4")||"[]"); } catch { return []; }
}

// ─── APP ─────────────────────────────────────────────────────────────────────
function App() {
  const [apiKey] = useState(getApiKey);

  const [tab, setTab] = useState("dashboard");
  const [stock, setStock] = useState(loadStock);
  const [sales, setSales] = useState(loadSales);
  const [scanModal, setScanModal] = useState(false);
  const [alertsModal, setAlertsModal] = useState(false);

  const [addModal, setAddModal] = useState(false);
  const [keyModal, setKeyModal] = useState(false);

  const saveStock = useCallback((s) => { setStock(s); localStorage.setItem("stock_v4", JSON.stringify(s)); }, []);
  const saveSales = useCallback((s) => { setSales(s); localStorage.setItem("sales_v4", JSON.stringify(s)); }, []);

  const applyValidatedSales = useCallback((lines) => {
    const ns = JSON.parse(JSON.stringify(stock));
    const today = new Date().toISOString().split("T")[0];
    const newEntries = [];
    for (const line of lines) {
      if (line.status !== "confirmed") continue;
      const { brand, itemKey, size, piece, raw } = line;
      if (brand === "sunProject" && ns.sunProject.items[itemKey]?.[size]) {
        ns.sunProject.items[itemKey][size].sold = (ns.sunProject.items[itemKey][size].sold||0)+1;
      } else if (brand === "bam") {
        const cell = ns.bam.hauts[itemKey]?.[size] || ns.bam.bas[itemKey]?.[size];
        if (cell) cell.sold = (cell.sold||0)+1;
      } else if (brand === "lagonBleue") {
        for (const cat of Object.values(ns.lagonBleue.categories)) {
          const cell = cat.items?.[itemKey]?.[size];
          if (cell) {
            if (cat.type === "2pieces") {
              if (piece === "haut") cell.soldHaut = (cell.soldHaut||0)+1;
              else if (piece === "bas") cell.soldBas = (cell.soldBas||0)+1;
              else { cell.soldHaut = (cell.soldHaut||0)+1; cell.soldBas = (cell.soldBas||0)+1; }
            } else {
              cell.sold = (cell.sold||0)+1;
            }
            break;
          }
        }
      }
      newEntries.push({ date:today, raw, brand, itemKey, size });
    }
    saveStock(ns); saveSales([...sales,...newEntries]); setScanModal(false);
  }, [stock, sales, saveStock, saveSales]);

  const today = new Date().toISOString().split("T")[0];
  const thisMonth = today.slice(0,7);
  const todaySales = sales.filter(s=>s.date===today);
  const monthSales = sales.filter(s=>s.date?.startsWith(thisMonth));
  const alerts = buildAlerts(stock);

  return (
    <div style={c.root}>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}} @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap');`}</style>
      <header style={c.header}>
        <div style={c.headerTop}>
          <div style={c.logo}><span style={{fontSize:24}}>👙</span><div><div style={c.logoT}>STOCK MAILLOT</div><div style={c.logoS}>Gestion de stock</div></div></div>
          <div style={{display:"flex",gap:8}}>
            {(alerts.ruptures.length>0||alerts.faibles.length>0)&&(
              <button style={c.alertBtn} onClick={()=>setAlertsModal(true)}>🔔 {alerts.ruptures.length+alerts.faibles.length}</button>
            )}
            <button style={c.receptionBtn} onClick={()=>setReceptionModal(true)}>📦</button>
            <button style={c.exportBtn} onClick={()=>exportToExcel(stock)}>📥</button>

// ─── ALERTS ──────────────────────────────────────────────────────────────────
function buildAlerts(stock) {
  const byBrand = { "🌊 Lagon Bleue": [], "👙 BAM": [], "🏄 Sun Project": [] };

  // Lagon Bleue
  Object.entries(stock.lagonBleue.categories).forEach(([catName, catData]) => {
    const is2P = catData.type === "2pieces";
    const items = catData.items || catData;
    Object.entries(items).forEach(([coloris, sizeMap]) => {
      Object.entries(sizeMap).forEach(([sz, cell]) => {
        if (is2P) {
          const h = getActuelHaut(cell), b = getActuelBas(cell);
          if (h <= 2) byBrand["🌊 Lagon Bleue"].push({ label:`${catName} > ${coloris} ${sz} (haut)`, actuel:h });
          if (b <= 2) byBrand["🌊 Lagon Bleue"].push({ label:`${catName} > ${coloris} ${sz} (bas)`, actuel:b });
        } else {
          const v = getActuel1P(cell);
          if (v <= 2) byBrand["🌊 Lagon Bleue"].push({ label:`${catName} > ${coloris} ${sz}`, actuel:v });
        }
      });
    });
  });

  // BAM
  ["hauts","bas"].forEach(sec => {
    Object.entries(stock.bam[sec]).forEach(([coloris, sizeMap]) => {
      Object.entries(sizeMap).forEach(([sz, cell]) => {
        const v = getActuel1P(cell);
        if (v <= 2) byBrand["👙 BAM"].push({ label:`${coloris} ${sz}`, actuel:v });
      });
    });
  });

  // Sun Project
  Object.entries(stock.sunProject.items).forEach(([coloris, sizeMap]) => {
    Object.entries(sizeMap).forEach(([sz, cell]) => {
      const v = getActuel1P(cell);
      if (v <= 2) byBrand["🏄 Sun Project"].push({ label:`${coloris} ${sz}`, actuel:v });
    });
  });

  const all = Object.values(byBrand).flat();
  return {
    byBrand,
    ruptures: all.filter(a=>a.actuel<=0),
    faibles: all.filter(a=>a.actuel>0&&a.actuel<=2)
  };
}

// ─── SCAN MODAL ──────────────────────────────────────────────────────────────
function ScanModal({ onClose, onConfirm, apiKey }) {
  const [step, setStep] = useState("upload");
  const [imgData, setImgData] = useState(null);
  const [lines, setLines] = useState([]);
  const [loading, setLoading] = useState(false);
  const fileRef = useRef();

  const handleFile = f => { const r=new FileReader(); r.onload=e=>setImgData(e.target.result); r.readAsDataURL(f); };

  const analyze = async () => {
    setLoading(true); setStep("analyzing");
    const base64=imgData.split(",")[1], mediaType=imgData.split(";")[0].split(":")[1];
    const prompt=`Tu analyses une feuille de caisse d'un magasin de maillots de bain. Extrait UNIQUEMENT la colonne "Désignation produit". Ignore Prix, CB, Espèces.

Marques :
- "sunProject" : shorts homme (Bleu Electrique, Corail Fluo, Kaki, Bleue Ciel, Jaune Fluo, Beige Gris, Vertdeau, Noir, Rayure Gris Blanc, Rayure Rouge Blanc, Gaufre Vert, Turtles Bleue, Hibiscus Flash, Gaufre Bleue, Gaufre Marine, Gaufre Kaki, Rose Pale, Fleur Blanche, Kaki GT, Noir GT, Bleue Ciel GT)
- "bam" : Triangle, Bandeau Souple, Bandeau Dur, SG GT, Culotte Normale, Culotte Nœud, Culotte GT, Tanga, Shorty + couleur
- "lagonBleue" : modèles nommés (Léa, Maya, Lili, Marilyn, Britt, Anita, Nathalie, Cécilia, Cécile, etc.) + couleur + taille numérique
  - Pour Lagon Bleue 2 pièces, précise si c'est "haut", "bas" ou "ensemble" dans le champ "piece"

Pour chaque ligne retourne :
{ "raw":"texte original", "brand":"sunProject|bam|lagonBleue|unknown", "itemKey":"ex: Triangle - Grecque", "size":"ex: M ou T38", "piece":"haut|bas|ensemble (lagonBleue 2P seulement)", "confidence":"high|medium|low", "issue":"si pas high" }

Réponds UNIQUEMENT en JSON valide, tableau, sans markdown.`;

    try {
      const res=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:2000,
          messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:mediaType,data:base64}},{type:"text",text:prompt}]}]})});
      const data=await res.json();
      const text=data.content.map(i=>i.text||"").join("");
      const parsed=JSON.parse(text.replace(/```json|```/g,"").trim());
      setLines(parsed.map(l=>({...l,status:l.confidence==="high"?"confirmed":l.confidence==="medium"?"pending":"error"})));
      setStep("review");
    } catch { alert("Erreur lors de l'analyse. Réessayez."); setStep("upload"); }
    finally { setLoading(false); }
  };

  const update=(i,f,v)=>setLines(prev=>prev.map((l,idx)=>idx===i?{...l,[f]:v}:l));
  const confirmed=lines.filter(l=>l.status==="confirmed").length;
  const pending=lines.filter(l=>l.status==="pending").length;
  const error=lines.filter(l=>l.status==="error").length;

  return (
    <div style={c.overlay}>
      <div style={c.modal}>
        <div style={c.modalHdr}>
          <div style={{fontWeight:800,fontSize:16}}>📸 Scanner la feuille de caisse</div>

        {step==="upload"&&<div style={{padding:16,display:"flex",flexDirection:"column",gap:12,alignItems:"center"}}>
          <div style={{width:"100%",minHeight:150,border:"2px dashed #e2e8f0",borderRadius:12,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",background:"#f8fafc",padding:16}}
            onClick={()=>fileRef.current?.click()} onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)handleFile(f);}}>

          {imgData&&<button style={{...c.scanBtn,width:"100%",padding:13,fontSize:15,borderRadius:12}} onClick={analyze}>🔍 Analyser la feuille</button>}
        </div>}

        {step==="analyzing"&&<div style={{padding:40,display:"flex",flexDirection:"column",alignItems:"center",gap:14}}>
          <div style={{width:38,height:38,border:"3px solid #f1f5f9",borderTop:"3px solid #f43f8e",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}></div>
          <p style={{fontWeight:700,margin:0}}>Lecture en cours…</p>
          <p style={{fontSize:12,color:"#94a3b8",margin:0}}>Analyse de chaque ligne de désignation</p>
        </div>}

        {step==="review"&&<div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
          <div style={{display:"flex",gap:6,padding:"10px 14px",flexWrap:"wrap",borderBottom:"1px solid #f1f5f9"}}>
            <span style={{background:"#f0fdf4",color:"#166534",padding:"3px 10px",borderRadius:20,fontSize:12,fontWeight:700}}>✅ {confirmed} confirmées</span>
            {pending>0&&<span style={{background:"#fef9c3",color:"#92400e",padding:"3px 10px",borderRadius:20,fontSize:12,fontWeight:700}}>⚠️ {pending} à vérifier</span>}

          </div>

// ─── ADD ITEM MODAL ──────────────────────────────────────────────────────────
function AddItemModal({ stock, saveStock, onClose }) {
  const [brand, setBrand] = useState("bam");
  const [section, setSection] = useState("hauts");
  const [category, setCategory] = useState(Object.keys(stock.lagonBleue.categories)[0]);
  const [catType, setCatType] = useState("1piece");
  const [newCat, setNewCat] = useState("");
  const [coloris, setColoris] = useState("");
  const [sizes, setSizes] = useState([{sz:"S",init:0},{sz:"M",init:0},{sz:"L",init:0},{sz:"XL",init:0}]);  const [msg, setMsg] = useState("");

  const defaultSizes = (b) => {
    if (b === "lagonBleue") return [{sz:"T34",init:0},{sz:"T36",init:0},{sz:"T38",init:0},{sz:"T40",init:0},{sz:"T42",init:0},{sz:"T44",init:0}];
    if (b === "sunProject") return [{sz:"S",init:0},{sz:"M",init:0},{sz:"L",init:0},{sz:"XL",init:0},{sz:"2XL",init:0}];
    return [{sz:"S",init:0},{sz:"M",init:0},{sz:"L",init:0},{sz:"XL",init:0}];
  };

  const handleBrandChange = (b) => { setBrand(b); setSizes(defaultSizes(b)); };
  const removeSize = (i) => setSizes(sizes.filter((_,idx)=>idx!==i));
  const updateSize = (i,field,val) => setSizes(sizes.map((s,idx)=>idx===i?{...s,[field]:val}:s));

  const handleSave = () => {
    if (!coloris.trim()) { setMsg("Entrez un nom de coloris"); return; }
    if (sizes.some(s=>!s.sz.trim())) { setMsg("Toutes les tailles doivent avoir un nom"); return; }
    const ns = JSON.parse(JSON.stringify(stock));
    const sizeMap = Object.fromEntries(sizes.map(s => [
      s.sz.trim(),
      catType==="2pieces" ? {init:parseInt(s.init)||0, soldHaut:0, soldBas:0} : {init:parseInt(s.init)||0, sold:0}
    ]));

    if (brand === "sunProject") {
      ns.sunProject.items[coloris.trim()] = sizeMap;
    } else if (brand === "bam") {
      ns.bam[section][coloris.trim()] = sizeMap;
    } else if (brand === "lagonBleue") {
      const catKey = newCat.trim() || category;
      if (newCat.trim()) {
        ns.lagonBleue.categories[catKey] = { type: catType, items: { [coloris.trim()]: sizeMap } };
      } else {
        if (!ns.lagonBleue.categories[catKey].items) ns.lagonBleue.categories[catKey].items = {};
        ns.lagonBleue.categories[catKey].items[coloris.trim()] = sizeMap;
      }
    }
    saveStock(ns);
    setMsg("✅ Article ajouté !");
    setTimeout(onClose, 800);
  };

  return (
    <div style={c.overlay}>
      <div style={{...c.modal,maxHeight:"90vh"}}>
        <div style={c.modalHdr}>
          <div style={{fontWeight:800,fontSize:16}}>➕ Ajouter un article</div>
          <button style={c.closeBtn} onClick={onClose}>✕</button>
        </div>
        <div style={{overflowY:"auto",flex:1,padding:"14px 16px",display:"flex",flexDirection:"column",gap:12}}>

          {/* Marque */}
          <div>
            <div style={c.label}>Marque</div>
            <div style={{display:"flex",gap:8}}>
              {[["sunProject","🏄 Sun Project"],["bam","👙 BAM"],["lagonBleue","🌊 Lagon Bleue"]].map(([v,l])=>(
                <button key={v} style={{...c.toggleBtn,...(brand===v?c.toggleActive:{})}} onClick={()=>handleBrandChange(v)}>{l}</button>
              ))}
            </div>
          </div>

          {/* BAM section */}
          {brand==="bam"&&<div>
            <div style={c.label}>Section</div>
            <div style={{display:"flex",gap:8}}>
              <button style={{...c.toggleBtn,...(section==="hauts"?c.toggleActive:{})}} onClick={()=>setSection("hauts")}>👆 Hauts</button>
              <button style={{...c.toggleBtn,...(section==="bas"?c.toggleActive:{})}} onClick={()=>setSection("bas")}>👇 Bas</button>
            </div>
          </div>}

          {/* Lagon Bleue catégorie */}
          {brand==="lagonBleue"&&<>
            <div>
              <div style={c.label}>Catégorie existante</div>
              <select style={c.select} value={category} onChange={e=>setCategory(e.target.value)}>
                {Object.keys(stock.lagonBleue.categories).map(k=><option key={k} value={k}>{k}</option>)}
              </select>
            </div>
            <div>
              <div style={c.label}>Ou nouvelle catégorie (laisser vide sinon)</div>
              <input style={c.inp} placeholder="Ex: 2P - Nouveau Modèle" value={newCat} onChange={e=>setNewCat(e.target.value)} />
            </div>
            {newCat.trim()&&<div>
              <div style={c.label}>Type</div>
              <div style={{display:"flex",gap:8}}>
                <button style={{...c.toggleBtn,...(catType==="1piece"?c.toggleActive:{})}} onClick={()=>setCatType("1piece")}>1 Pièce</button>
                <button style={{...c.toggleBtn,...(catType==="2pieces"?c.toggleActive:{})}} onClick={()=>setCatType("2pieces")}>2 Pièces</button>
              </div>
            </div>}
          </>}

          {/* Coloris */}
          <div>
            <div style={c.label}>Nom du coloris / modèle</div>
            <input style={c.inp} placeholder="Ex: Triangle - Corail" value={coloris} onChange={e=>setColoris(e.target.value)} />
          </div>

          {/* Tailles */}
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <div style={c.label}>Tailles et stock initial</div>
              <button style={{background:"#f1f5f9",border:"none",borderRadius:6,padding:"4px 10px",fontSize:12,cursor:"pointer",fontWeight:600}} onClick={addSize}>+ Taille</button>
            </div>
            {sizes.map((s,i)=>(
              <div key={i} style={{display:"grid",gridTemplateColumns:"1fr 1fr 30px",gap:6,marginBottom:6}}>
                <input style={c.inp} placeholder="Taille (ex: XL)" value={s.sz} onChange={e=>updateSize(i,"sz",e.target.value)} />
                <input style={c.inp} type="number" placeholder="Stock initial" value={s.init} onChange={e=>updateSize(i,"init",e.target.value)} />
                <button style={{background:"#fef2f2",border:"none",borderRadius:6,cursor:"pointer",color:"#ef4444",fontWeight:700}} onClick={()=>removeSize(i)}>✕</button>
              </div>
            ))}
          </div>

          {msg&&<div style={{textAlign:"center",fontWeight:700,color:msg.startsWith("✅")?"#22c55e":"#ef4444",fontSize:13}}>{msg}</div>}
        </div>
        <div style={{padding:"10px 16px",borderTop:"1px solid #f1f5f9"}}>
          <button style={{width:"100%",background:"linear-gradient(135deg,#22c55e,#0ea5e9)",color:"#fff",border:"none",borderRadius:12,padding:13,fontWeight:800,fontSize:14,cursor:"pointer"}} onClick={handleSave}>
            ✅ Enregistrer l'article
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── EXPORT CSV ──────────────────────────────────────────────────────────────
function exportToExcel(stock) {
  const date = new Date().toLocaleDateString("fr-FR").replace(/\//g,"-");
  let csv = "";

  const addSection = (title, items, is2P=false) => {
    csv += `\n${title}\nColoris,Taille,`;
    if (is2P) csv += "Stock Initial,Vendu Haut,Vendu Bas,Reste Haut,Reste Bas\n";
    else csv += "Stock Initial,Vendu,Stock Actuel\n";
    Object.entries(items).forEach(([coloris, sizeMap]) => {
      Object.entries(sizeMap).forEach(([sz, cell]) => {
        if (is2P) {
          csv += `"${coloris}",${sz},${cell.init||0},${cell.soldHaut||0},${cell.soldBas||0},${(cell.init||0)-(cell.soldHaut||0)},${(cell.init||0)-(cell.soldBas||0)}\n`;
        } else {
          csv += `"${coloris}",${sz},${cell.init||0},${cell.sold||0},${(cell.init||0)-(cell.sold||0)}\n`;
        }
      });
    });
  };

  csv += "=== SUN PROJECT ===\n";
  addSection("Sun Project - Shorts", stock.sunProject.items);
  csv += "\n=== LAGON BLEUE ===\n";
  Object.entries(stock.lagonBleue.categories).forEach(([catName, catData]) => {
    addSection(`Lagon Bleue - ${catName}`, catData.items||catData, catData.type==="2pieces");
  });
  csv += "\n=== BAM ===\n";
  addSection("BAM - Hauts", stock.bam.hauts);
  addSection("BAM - Bas", stock.bam.bas);

  // Use data URI - works in all environments including sandboxed iframes
  const dataUri = "data:text/csv;charset=utf-8,\uFEFF" + encodeURIComponent(csv);
  const a = document.createElement("a");
  a.setAttribute("href", dataUri);
  a.setAttribute("download", `Stock_Maillot_${date}.csv`);
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// ─── RECEPTION LIVRAISON MODAL ───────────────────────────────────────────────
function ReceptionModal({ onClose, stock, saveStock, apiKey }) {
  const [step, setStep] = useState("upload");
  const [imgData, setImgData] = useState(null);
  const [brand, setBrand] = useState("lagonBleue");
  const [lines, setLines] = useState([]);
  const [loading, setLoading] = useState(false);
  const fileRef = useRef();

  const handleFile = f => {
    const r = new FileReader();
    r.onload = e => setImgData(e.target.result);
    r.readAsDataURL(f);
  };

  const analyze = async () => {
    setLoading(true); setStep("analyzing");
    const base64 = imgData.split(",")[1], mediaType = imgData.split(";")[0].split(":")[1];

    const brandPrompts = {
      lagonBleue: `C'est un bon de livraison Lagon Bleue. Extrait chaque article avec son modèle, coloris, taille et quantité reçue.
Exemples : "2 pièces Léa Uni Marine T36 → qty:2", "Maya Kaki T38 → qty:3"
Format JSON : [{"raw":"texte","itemKey":"ex: Marine","category":"ex: 2P - Léa Uni","size":"T38","qty":2,"confidence":"high|medium|low","issue":"si pas high"}]`,
      sunProject: `C'est une facture Sun Project (shorts homme). Extrait chaque référence avec coloris, taille et quantité.
Format JSON : [{"raw":"texte","itemKey":"ex: Gaufre Kaki","size":"L","qty":3,"confidence":"high|medium|low","issue":"si pas high"}]`,
      bam: `C'est un bon de livraison BAM (Bar à Maillot). Extrait chaque article avec type (Triangle/Bandeau Souple/Bandeau Dur/SG GT/Culotte Normale/Culotte Nœud/Culotte GT/Tanga/Shorty), couleur, taille et quantité.
Format JSON : [{"raw":"texte","itemKey":"ex: Triangle - Grecque","section":"hauts|bas","size":"M","qty":4,"confidence":"high|medium|low","issue":"si pas high"}]`
    };

    const prompt = `Tu analyses un bon de livraison/facture pour un magasin de maillots de bain.
${brandPrompts[brand]}
Réponds UNIQUEMENT en JSON valide, tableau, sans markdown.`;

    try {
      const res = await fetch("/api/analyze", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:2000,
          messages:[{role:"user",content:[
            {type:"image",source:{type:"base64",media_type:mediaType,data:base64}},
            {type:"text",text:prompt}
          ]}]})
      });
      const data = await res.json();
      const text = data.content.map(i=>i.text||"").join("");
      const parsed = JSON.parse(text.replace(/```json|```/g,"").trim());
      setLines(parsed.map(l=>({...l, status:l.confidence==="high"?"confirmed":l.confidence==="medium"?"pending":"error"})));
      setStep("review");
    } catch { alert("Erreur lors de l'analyse. Réessayez."); setStep("upload"); }
    finally { setLoading(false); }
  };

  const update = (i,f,v) => setLines(prev=>prev.map((l,idx)=>idx===i?{...l,[f]:v}:l));

  const applyReception = () => {
    const ns = JSON.parse(JSON.stringify(stock));
    let count = 0;
    for (const line of lines) {
      if (line.status !== "confirmed") continue;
      const qty = parseInt(line.qty) || 0;
      if (qty <= 0) continue;
      if (brand === "sunProject") {
        if (ns.sunProject.items[line.itemKey]?.[line.size]) {
          ns.sunProject.items[line.itemKey][line.size].init += qty;
        } else if (ns.sunProject.items[line.itemKey]) {
          ns.sunProject.items[line.itemKey][line.size] = {init:qty, sold:0};
        }
      } else if (brand === "bam") {
        const sec = line.section==="bas" ? "bas" : "hauts";
        if (ns.bam[sec][line.itemKey]?.[line.size]) {
          ns.bam[sec][line.itemKey][line.size].init += qty;
        } else if (ns.bam[sec][line.itemKey]) {
          ns.bam[sec][line.itemKey][line.size] = {init:qty, sold:0};
        }
      } else if (brand === "lagonBleue") {
        const cat = ns.lagonBleue.categories[line.category];
        if (cat?.items?.[line.itemKey]?.[line.size]) {
          const cell = cat.items[line.itemKey][line.size];
          cell.init += qty;
        } else if (cat?.items?.[line.itemKey]) {
          const is2P = cat.type === "2pieces";
          cat.items[line.itemKey][line.size] = is2P ? {init:qty,soldHaut:0,soldBas:0} : {init:qty,sold:0};
        }
      }
      count++;
    }
    saveStock(ns);
    alert(`✅ ${count} article${count>1?"s":""} ajouté${count>1?"s":""} au stock !`);
    onClose();
  };

  const confirmed = lines.filter(l=>l.status==="confirmed").length;
  const pending = lines.filter(l=>l.status==="pending").length;
  const error = lines.filter(l=>l.status==="error").length;

  return (
    <div style={c.overlay}>
      <div style={c.modal}>
        <div style={c.modalHdr}>
          <div style={{fontWeight:800,fontSize:16}}>📦 Réception livraison</div>
          <button style={c.closeBtn} onClick={onClose}>✕</button>
        </div>

        {step==="upload"&&<div style={{padding:16,display:"flex",flexDirection:"column",gap:12}}>
          <div>
            <div style={c.label}>Marque du bon de livraison</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              {[["lagonBleue","🌊 Lagon Bleue"],["bam","👙 BAM"],["sunProject","🏄 Sun Project"]].map(([v,l])=>(
                <button key={v} style={{...c.toggleBtn,...(brand===v?c.toggleActive:{})}} onClick={()=>setBrand(v)}>{l}</button>
              ))}
            </div>
          </div>
          <div style={{minHeight:150,border:"2px dashed #e2e8f0",borderRadius:12,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",background:"#f8fafc",padding:16}}
            onClick={()=>fileRef.current?.click()} onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)handleFile(f);}}>
            {imgData?<img src={imgData} style={{maxWidth:"100%",maxHeight:220,borderRadius:8,objectFit:"contain"}} />:<>
              <div style={{fontSize:36}}>📄</div>
              <p style={{fontWeight:600,margin:"8px 0 4px"}}>Photo ou glisser le bon ici</p>
              <p style={{fontSize:12,color:"#94a3b8",margin:0}}>JPG, PNG acceptés</p>
            </>}
          </div>
          <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>e.target.files[0]&&handleFile(e.target.files[0])} />
          {imgData&&<button style={{...c.scanBtn,width:"100%",padding:13,fontSize:15,borderRadius:12}} onClick={analyze}>🔍 Analyser le bon de livraison</button>}
        </div>}

        {step==="analyzing"&&<div style={{padding:40,display:"flex",flexDirection:"column",alignItems:"center",gap:14}}>
          <div style={{width:38,height:38,border:"3px solid #f1f5f9",borderTop:"3px solid #22c55e",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}></div>
          <p style={{fontWeight:700,margin:0}}>Lecture du bon en cours…</p>
          <p style={{fontSize:12,color:"#94a3b8",margin:0}}>Extraction des articles et quantités</p>
        </div>}

        {step==="review"&&<div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
          <div style={{display:"flex",gap:6,padding:"10px 14px",flexWrap:"wrap",borderBottom:"1px solid #f1f5f9"}}>
            <span style={{background:"#f0fdf4",color:"#166534",padding:"3px 10px",borderRadius:20,fontSize:12,fontWeight:700}}>✅ {confirmed} confirmés</span>
            {pending>0&&<span style={{background:"#fef9c3",color:"#92400e",padding:"3px 10px",borderRadius:20,fontSize:12,fontWeight:700}}>⚠️ {pending} à vérifier</span>}
            {error>0&&<span style={{background:"#fef2f2",color:"#991b1b",padding:"3px 10px",borderRadius:20,fontSize:12,fontWeight:700}}>❌ {error} illisibles</span>}
          </div>
          <div style={{flex:1,overflowY:"auto",padding:"10px 12px"}}>
            {lines.map((line,i)=>(
              <div key={i} style={{background:"#f8fafc",borderRadius:10,padding:"10px 12px",marginBottom:8,borderLeft:`4px solid ${line.status==="confirmed"?"#22c55e":line.status==="pending"?"#f59e0b":"#ef4444"}`}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:6,gap:8}}>
                  <span style={{fontSize:13,fontWeight:600,fontStyle:"italic",color:"#334155",flex:1}}>"{line.raw}"</span>
                  <div style={{display:"flex",gap:4,flexShrink:0}}>
                    {line.status!=="confirmed"&&<button style={{background:"#22c55e",color:"#fff",border:"none",borderRadius:6,width:26,height:26,cursor:"pointer",fontWeight:700}} onClick={()=>update(i,"status","confirmed")}>✓</button>}

      <div style={{...c.modal,maxHeight:"auto"}}>
        <div style={c.modalHdr}>
          <div style={{fontWeight:800,fontSize:16}}>🔑 Clé API Anthropic</div>
          <button style={c.closeBtn} onClick={onClose}>✕</button>
        </div>
        <div style={{padding:20,display:"flex",flexDirection:"column",gap:12}}>
          <p style={{fontSize:13,color:"#64748b"}}>Entre ta clé API pour activer le scan photo. Elle sera sauvegardée sur cet appareil.</p>
          <input
            style={{...c.inp,fontSize:12}}
            placeholder="sk-ant-api03-..."
            value={key}
            onChange={e=>setKey(e.target.value)}
            autoFocus
          />
          {err&&<p style={{fontSize:12,color:"#ef4444",margin:0}}>{err}</p>}
          <button style={{background:"linear-gradient(135deg,#f43f8e,#f97316)",color:"#fff",border:"none",borderRadius:12,padding:13,fontWeight:800,fontSize:14,cursor:"pointer"}} onClick={handle}>
            ✅ Sauvegarder la clé
          </button>
        </div>
      </div>
    </div>
  );
}
